name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Static site: no manifest, so no install/build/test commands exist yet.
      # Add real build/test steps here once a package manifest is introduced.
      - name: No build or test defined
        run: echo "Static site with no manifest; nothing to build or test."
